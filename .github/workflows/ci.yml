name: Tests and lint
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        # CPython 3.12.10 has no Ubuntu 26.04 distribution. Do not drift with latest.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Native Linux dependencies (not skipped)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libblas3 liblapack3
      - name: Isolate exact dependencies from runner preinstalled packages
        shell: python
        run: |
          import os
          import venv
          from pathlib import Path
          target = Path('.venv').resolve()
          venv.create(target, with_pip=True)
          scripts = target / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(scripts) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('VIRTUAL_ENV=' + str(target) + '\n')
      - run: python tools/ci_step.py --name install-pins -- -m pip install -r requirements.lock
      - run: python tools/ci_step.py --name install-project -- -m pip install --no-deps --no-build-isolation -e .
      - run: python tools/ci_step.py --name pip-check -- -m pip check
      - run: python tools/ci_step.py --name quality -- tools/check.py
      - run: python tools/ci_step.py --name audit -- tools/list_unverified.py
      - run: python tools/ci_step.py --name source-selftest -- -m struct_ai --selftest --output .artifacts/source-selftest.json
      - name: Upload source test evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m0b-source-evidence-${{ matrix.os }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
